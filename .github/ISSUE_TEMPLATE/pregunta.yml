name: Pregunta sobre la normativa
description: Una pregunta real que te gustaría que el RAG respondiera. Con estas preguntas armamos el conjunto de prueba.
title: "¿...?"
labels: ["pregunta"]
body:
  - type: markdown
    attributes:
      value: |
        **Escribe tu pregunta en el título**, como se la harías a alguien de la Secretaría. Ejemplo: «¿Cuántas veces puedo cancelar una asignatura?». Lo de abajo es opcional.
  - type: textarea
    id: contexto
    attributes:
      label: ¿En qué situación te surgió? (opcional)
      description: Por ejemplo, «quería cancelar Cálculo y no sabía si me afectaba el promedio».
  - type: textarea
    id: respuesta
    attributes:
      label: ¿Sabes la respuesta o en qué norma está? (opcional)
      description: Si la sabes, nos sirve para comprobar si el RAG acierta.
  - type: dropdown
    id: tema
    attributes:
      label: Tema (opcional)
      options:
        - Matrícula y cancelaciones
        - Notas, promedio y pérdida de calidad de estudiante
        - Grado y trabajo de grado
        - Becas, apoyos y bienestar
        - Otro
